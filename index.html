<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>Fantasy Football League Manager</title>
<style>
  :root {
    --bg: #101c16;
    --panel: #16261e;
    --card: #1d3025;
    --card-hover: #24392c;
    --line: #2c4436;
    --text: #eae7da;
    --text-dim: #93a89a;
    --text-faint: #5f7568;
    --gold: #d7a53e;
    --win: #5fa37a;
    --loss: #c1503f;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #app { max-width: 1080px; margin: 0 auto; padding: 18px 18px 60px; }

  .yardline {
    height: 6px;
    background: repeating-linear-gradient(115deg, var(--line) 0px, var(--line) 2px, transparent 2px, transparent 14px);
    opacity: 0.6;
    margin: 14px 0;
    border-radius: 2px;
  }

  /* header / nav */
  .topbar { display:flex; align-items:flex-end; justify-content:space-between; flex-wrap:wrap; gap:10px; }
  .brand-eyebrow { font-size:11px; letter-spacing:0.18em; color:var(--gold); font-weight:700; }
  .brand-title { margin:2px 0 0; font-size:26px; font-weight:800; letter-spacing:-0.01em; }
  .nav { display:flex; gap:4px; margin-top:16px; flex-wrap:wrap; }
  .nav-btn {
    background:none; border:none; color:var(--text-faint); font-size:13px; font-weight:700;
    letter-spacing:0.03em; padding:8px 4px; cursor:pointer; border-bottom:2px solid transparent; margin-right:16px;
  }
  .nav-btn.active { color:var(--text); border-bottom-color:var(--gold); }

  /* buttons / inputs */
  .btn {
    display:inline-flex; align-items:center; gap:6px; padding:9px 14px; border-radius:8px;
    border:1px solid var(--line); background:var(--card); color:var(--text); font-size:13px;
    font-weight:600; cursor:pointer; white-space:nowrap;
  }
  .btn:hover { background:var(--card-hover); }
  .btn:disabled { opacity:0.5; cursor:default; }
  .btn-primary { background:var(--gold); border-color:var(--gold); color:#1a1305; }
  .btn-primary:hover { background:#e2b34e; }
  .btn-danger { color:var(--loss); }
  .btn-sm { padding:6px 10px; font-size:12px; }
  input[type=text], select {
    background:var(--panel); border:1px solid var(--line); color:var(--text);
    padding:10px 12px; border-radius:8px; font-size:14px; outline:none;
  }
  input[type=text]:focus, select:focus { border-color: var(--gold); }
  input::placeholder { color: var(--text-faint); }

  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .banner-error {
    display:flex; align-items:center; gap:8px; color:var(--loss); font-size:13px;
    background:rgba(193,80,63,0.1); border:1px solid rgba(193,80,63,0.35); padding:8px 12px;
    border-radius:8px; margin-top:12px;
  }
  .muted { color: var(--text-faint); }
  .mono { font-family: ui-monospace, "SF Mono", Consolas, monospace; }

  /* dashboard cards */
  .league-grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(260px,1fr)); gap:14px; margin-top:16px; }
  .league-card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; cursor:pointer; }
  .league-card:hover { border-color: var(--gold); }
  .league-card-title { font-weight:700; font-size:15px; margin-bottom:2px; }
  .league-card-sub { font-size:11px; color:var(--text-faint); margin-bottom:10px; }
  .league-card-row { display:flex; justify-content:space-between; font-size:12.5px; padding:3px 0; border-top:1px solid var(--line); }
  .league-card-actions { display:flex; gap:6px; margin-top:10px; }
  .empty-state { text-align:center; color:var(--text-faint); padding:60px 20px; }

  /* tabs / panel */
  .tabs { display:flex; align-items:center; gap:4px; margin: 16px 0 14px; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  table { width:100%; border-collapse:collapse; }
  thead th { text-align:left; font-size:11px; letter-spacing:0.08em; color:var(--text-faint); padding:10px 14px; border-bottom:1px solid var(--line); font-weight:700; }
  .num { text-align:right !important; }
  tbody tr:nth-child(odd) { background: rgba(255,255,255,0.015); }
  tbody td { padding:10px 14px; font-size:14px; border-bottom:1px solid var(--line); }
  .rank { color:var(--gold); font-weight:800; font-family: ui-monospace, monospace; }

  /* roster cards */
  .roster-grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(260px,1fr)); gap:14px; }
  .rcard { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; }
  .rcard-head { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px; border-bottom:1px solid var(--line); padding-bottom:8px; }
  .rcard-title { font-weight:700; font-size:14px; }
  .rcard-count { font-size:11px; color:var(--text-faint); }
  .rcard-section { margin-bottom:10px; }
  .rcard-section:last-child { margin-bottom:0; }
  .rcard-section-label { font-size:10px; letter-spacing:0.1em; color:var(--text-faint); font-weight:700; margin-bottom:6px; }
  .prow { display:flex; align-items:center; gap:6px; font-size:12.5px; padding:3px 0; flex-wrap:nowrap; }
  .prow.empty { opacity:0.55; }
  .slot-tag { font-size:9.5px; font-weight:700; color:var(--text-faint); min-width:28px; flex-shrink:0; font-family: ui-monospace, monospace; white-space:nowrap; }
  .pname { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pbadge { font-size:9.5px; font-weight:800; color:#10160e; padding:1px 6px; border-radius:4px; letter-spacing:0.02em; flex-shrink:0; }
  .pteam { font-size:10px; color:var(--text-faint); width:26px; text-align:right; font-family: ui-monospace, monospace; flex-shrink:0; }

  /* finder */
  .finder-result { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:10px; }
  .finder-player-name { font-weight:700; font-size:14px; }
  .finder-hit { display:flex; justify-content:space-between; font-size:12.5px; padding:4px 0; border-top:1px solid var(--line); margin-top:6px; }

  /* compare */
  .compare-grid { display:grid; grid-template-columns: 1fr 1fr; gap:14px; }
  @media (max-width:680px) { .compare-grid { grid-template-columns: 1fr; } }
  .mu-slot-row { display:grid; grid-template-columns: 1fr 40px 52px 40px 1fr; column-gap:6px; row-gap:2px; align-items:center; padding:9px 0; border-top:1px solid var(--line); }
  .mu-name { font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .mu-meta { font-size:10px; color:var(--text-faint); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .mu-score { font-family: ui-monospace, "SF Mono", Consolas, monospace; font-weight:800; font-size:13px; }
  .mu-score-sub { font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size:10px; color:var(--text-faint); }
  .mu-slot-label { text-align:center; font-weight:800; font-size:14px; color:var(--gold); letter-spacing:0.03em; }
  @media (max-width:480px) {
    .mu-slot-row { grid-template-columns: 1fr 32px 40px 32px 1fr; column-gap:4px; padding:7px 0; }
    .mu-name, .mu-score { font-size:11.5px; }
    .mu-meta, .mu-score-sub { font-size:9px; }
    .mu-slot-label { font-size:12px; }
  }
  .compare-picker { display:flex; flex-direction:column; gap:6px; margin-bottom:10px; }

  .spin { display:inline-block; animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner {
    display:inline-block; width:10px; height:10px;
    border:2px solid currentColor; border-right-color:transparent;
    border-radius:50%; animation: spin 0.7s linear infinite;
    vertical-align:-1px;
  }

  @media (max-width:520px) {
    #app { padding:14px 12px 40px; }
    .brand-title { font-size:21px; }
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =========================================================
   STORAGE
========================================================= */
const STORE_PREFIX = "slm.";
const DB = {
  get(key, fallback) {
    try {
      const raw = localStorage.getItem(STORE_PREFIX + key);
      return raw ? JSON.parse(raw) : fallback;
    } catch (e) { return fallback; }
  },
  set(key, value) {
    try {
      localStorage.setItem(STORE_PREFIX + key, JSON.stringify(value));
      return true;
    } catch (e) {
      console.error("Storage write failed", e);
      return false;
    }
  },
  remove(key) { localStorage.removeItem(STORE_PREFIX + key); }
};

function getLeagues() { return DB.get("leagues", []); }
function saveLeagues(list) { DB.set("leagues", list); }
function getLeagueData(id) { return DB.get("league." + id, null); }
function saveLeagueData(id, data) { DB.set("league." + id, data); }
function removeLeagueData(id) { DB.remove("league." + id); }
function getPlayersCache() { return DB.get("players", null); }
function savePlayersCache(obj) { DB.set("players", obj); }

function getCloudConfig() { return DB.get("cloud", null); }
function saveCloudConfig(cfg) { DB.set("cloud", cfg); }
function clearCloudConfig() { DB.remove("cloud"); }

/* Profile: which person is using this device. Local only, never synced -
   it's what keys each person's "my team" pick so two people sharing the
   same cloud sync don't overwrite each other's team selection. */
function getProfile() { return DB.get("profile", null); }
function setProfile(name) { DB.set("profile", name); }

/* Raw stored pick for the current profile on a league: a roster id,
   the sentinel "NONE" (explicitly not my league), or null (undecided). */
function rawTeamPick(league) {
  const profile = getProfile();
  if (!profile) return null;
  if (league.teams && league.teams[profile] !== undefined) return league.teams[profile];
  if (league.myRosterId && !league.teams) return league.myRosterId; // legacy single-owner data
  return null;
}
function myTeamFor(league) {
  const raw = rawTeamPick(league);
  return raw && raw !== "NONE" ? raw : null;
}
function isDismissedByMe(league) {
  return rawTeamPick(league) === "NONE";
}

/* =========================================================
   CLOUD SYNC (Supabase) - syncs only the saved-league list
   (id + nickname) across devices. Roster/standings/player data
   always comes fresh from Sleeper on whatever device you're on.
========================================================= */
async function cloudFetch(path, options) {
  const cfg = getCloudConfig();
  if (!cfg) throw new Error("Cloud sync isn't connected.");
  const res = await fetch(`${cfg.url}/rest/v1/${path}`, Object.assign({}, options, {
    headers: Object.assign({
      apikey: cfg.key,
      Authorization: `Bearer ${cfg.key}`,
      "Content-Type": "application/json",
      "x-app-passphrase": cfg.passphrase || "",
    }, (options && options.headers) || {})
  }));
  if (!res.ok) {
    const text = await res.text().catch(() => "");
    const authHint = res.status === 401 || res.status === 403 ? " Check that the passphrase matches on both devices." : "";
    throw new Error("Cloud sync error (" + res.status + "):" + authHint + " " + text.slice(0, 140));
  }
  return res.status === 204 ? null : res.json();
}
async function cloudPullLeagues() {
  const rows = await cloudFetch("leagues?select=*");
  return (rows || []).map(r => ({
    id: r.id, nickname: r.nickname, addedAt: r.added_at, teams: r.teams || {},
    source: r.source || "sleeper", manualData: r.manual_data || null,
    waiverSchedule: r.waiver_schedule || ""
  }));
}
async function cloudUpsertLeague(l) {
  const body = {
    id: l.id, nickname: l.nickname, added_at: l.addedAt || Date.now(),
    teams: l.teams || {}, source: l.source || "sleeper",
    waiver_schedule: l.waiverSchedule || ""
  };
  if (l.source === "manual") {
    body.manual_data = getLeagueData(l.id) || null; // manual leagues have no other source to re-sync from
  }
  await cloudFetch("leagues?on_conflict=id", {
    method: "POST",
    headers: { Prefer: "resolution=merge-duplicates" },
    body: JSON.stringify([body])
  });
}
async function cloudDeleteLeague(id) {
  await cloudFetch(`leagues?id=eq.${encodeURIComponent(id)}`, { method: "DELETE" });
}

/* =========================================================
   SLEEPER API
========================================================= */
let NFL_STATE = null;
async function ensureNflState() {
  if (NFL_STATE) return NFL_STATE;
  NFL_STATE = await fetchJSON(`${SLEEPER}/state/nfl`);
  return NFL_STATE;
}
const SLEEPER = "https://api.sleeper.app/v1";

async function fetchJSON(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error("Sleeper API error (" + res.status + ")");
  return res.json();
}

async function syncLeagueData(leagueId) {
  const [league, rosters, users] = await Promise.all([
    fetchJSON(`${SLEEPER}/league/${leagueId}`),
    fetchJSON(`${SLEEPER}/league/${leagueId}/rosters`),
    fetchJSON(`${SLEEPER}/league/${leagueId}/users`),
  ]);
  if (!league) throw new Error("No league found for that ID.");
  const data = { league, rosters: rosters || [], users: users || [], syncedAt: Date.now() };
  saveLeagueData(leagueId, data);
  return data;
}

const PLAYERS_MAX_AGE_MS = 7 * 24 * 60 * 60 * 1000; // 7 days

async function ensurePlayers(force) {
  const cached = getPlayersCache();
  if (cached && !force && (Date.now() - cached.updatedAt) < PLAYERS_MAX_AGE_MS) {
    return cached.map;
  }
  const data = await fetchJSON(`${SLEEPER}/players/nfl`);
  const trimmed = {};
  for (const id in data) {
    const p = data[id];
    trimmed[id] = {
      first_name: p.first_name, last_name: p.last_name,
      position: p.position, fantasy_positions: p.fantasy_positions,
      team: p.team, status: p.status, injury_status: p.injury_status
    };
  }
  const payload = { updatedAt: Date.now(), map: trimmed };
  const ok = savePlayersCache(payload);
  if (!ok && cached) return cached.map; // storage full - fall back to whatever we had
  return trimmed;
}

/* =========================================================
   DOMAIN HELPERS
========================================================= */
const POS_COLOR = {
  QB: "#6b8fc4", RB: "#6fae6f", WR: "#b06fae", TE: "#c98f4a", K: "#7d8a94", DEF: "#7d8a94",
  DL: "#c1503f", "DL-EDGE": "#c1503f", "DL-DT": "#8f3a2e",
  LB: "#d7a53e",
  DB: "#3f9ba8", "DB-CB": "#3f9ba8", "DB-S": "#2c6e78", "DB-NB": "#5fc2cf",
};

function subType(p) {
  if (!p) return null;
  const fp = (p.fantasy_positions && p.fantasy_positions[0]) || p.position;
  const pos = (p.position || "").toUpperCase();
  if (fp === "DL") {
    if (pos === "DE" || pos === "EDGE") return "EDGE";
    if (pos === "DT" || pos === "NT") return "DT";
    return null;
  }
  if (fp === "DB") {
    if (pos === "CB") return "CB";
    if (["S","SS","FS"].includes(pos)) return "S";
    if (["NB","NCB"].includes(pos)) return "NB";
    return null;
  }
  return null;
}
function badgeInfo(p) {
  const fp = (p && (p.fantasy_positions?.[0] || p.position)) || "?";
  const st = subType(p);
  const key = st ? `${fp}-${st}` : fp;
  return { label: st || fp, color: POS_COLOR[key] || POS_COLOR[fp] || "#5f7568" };
}
function playerName(p, id) {
  if (!p) return id;
  return (`${p.first_name || ""} ${p.last_name || ""}`).trim() || id;
}
function teamLabel(roster, users) {
  const owner = users.find(u => u.user_id === roster.owner_id);
  const metaName = owner?.metadata?.team_name;
  if (metaName && metaName.trim()) return metaName.trim();
  if (owner?.display_name) return owner.display_name;
  return `Roster ${roster.roster_id}`;
}
function computeStandings(rosters, users) {
  const rows = rosters.map(r => {
    const s = r.settings || {};
    const pf = (s.fpts || 0) + (s.fpts_decimal || 0) / 100;
    const pa = (s.fpts_against || 0) + (s.fpts_against_decimal || 0) / 100;
    return { rosterId: r.roster_id, name: teamLabel(r, users), wins: s.wins||0, losses: s.losses||0, ties: s.ties||0, pf, pa, raw: r };
  });
  rows.sort((a,b) => b.wins !== a.wins ? b.wins - a.wins : b.pf - a.pf);
  return rows;
}
function starterSlots(league) {
  if (!league?.roster_positions) return [];
  return league.roster_positions.filter(p => !["BN","IR","TAXI"].includes(p));
}
function fmtTime(ts) {
  if (!ts) return "never";
  const d = new Date(ts);
  return d.toLocaleDateString([], {month:"short", day:"numeric"}) + " " + d.toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"});
}

const POS_GROUPS = ["QB","RB","WR","TE","DL","LB","DB","K","DEF"];

/* =========================================================
   APP STATE + ROUTER
========================================================= */
let PLAYERS = getPlayersCache()?.map || null;
let STATE = {
  route: "dashboard",
  leagueId: null,
  tab: "standings",
  rosterFilter: "",
  compareA: { leagueId: null, rosterId: null },
  compareB: { leagueId: null, rosterId: null },
  loading: false,
  error: null,
  matchupWeek: null,
  matchupsCache: {},
  matchupsMyOnly: true,
  matchupDetailLeagueId: null,
  matchupDetailWeek: null,
  matchupDetailPair: null,
  matchupPlayerPoints: {},
  nflSchedule: null,
  matchupDetailScoring: null,
  trending: null,
  trendingType: "add",
  transactions: null,
  transactionsShown: 30,
  transactionsWide: false,
  transactionsLeagueFilter: "all",
  transactionsTypeFilter: "all",
  exposureFilter: "",
  finderQuery: "",
  draftsByLeague: {},
  picksByDraft: {},
  draftsLoaded: false,
  selectedLeagueId: null,
  selectedDraftId: null,
  showFinderPoints: false,
  playerSeasonStats: {},
  rankingsLeagueId: null,
  rankingsPosition: "QB",
  rankingsData: {},
};
let draftPollInterval = null;

function setState(patch) { Object.assign(STATE, patch); render(); }
function navigate(route, extra) {
  if (route !== "draft" && draftPollInterval) { clearInterval(draftPollInterval); draftPollInterval = null; }
  setState(Object.assign({ route, error: null }, extra || {}));
}

function el(html) {
  const t = document.createElement("template");
  t.innerHTML = html.trim();
  return t.content;
}

async function withLoading(fn) {
  setState({ loading: true, error: null });
  try { await fn(); }
  catch (e) { setState({ loading: false, error: e.message || "Something went wrong." }); return; }
  setState({ loading: false });
}

/* -------- actions exposed to inline handlers -------- */
window.onAddLeagueSourceChange = function (source) {
  const input = document.getElementById("add-league-input");
  if (!input) return;
  input.placeholder = source === "manual" ? 'League name (e.g. "ESPN Redraft")' : "Paste a Sleeper league ID...";
};

window.addLeague = async function () {
  const input = document.getElementById("add-league-input");
  const sourceSelect = document.getElementById("add-league-source");
  const source = (sourceSelect && sourceSelect.value) || "sleeper";
  const value = (input.value || "").trim();
  if (!value) return;

  if (source === "manual") {
    await withLoading(async () => {
      const id = "manual-" + Date.now().toString(36);
      const leagueData = {
        league: { name: value, season: String(new Date().getFullYear()), roster_positions: [] },
        rosters: [], users: [], syncedAt: Date.now()
      };
      saveLeagueData(id, leagueData);
      const leagues = getLeagues();
      const entry = { id, nickname: value, addedAt: Date.now(), source: "manual" };
      leagues.push(entry);
      saveLeagues(leagues);
      if (getCloudConfig()) {
        try { await cloudUpsertLeague(entry); } catch (e) { console.error("Cloud push failed", e); }
      }
      input.value = "";
      navigate("league", { leagueId: id, tab: "standings" });
    });
    return;
  }

  if (source !== "sleeper") {
    setState({ error: "That source isn't wired up yet - only Sleeper and Manual work right now." });
    return;
  }

  const id = value;
  await withLoading(async () => {
    const data = await syncLeagueData(id);
    if (!PLAYERS) PLAYERS = await ensurePlayers(false);
    const leagues = getLeagues();
    let entry = leagues.find(l => l.id === id);
    if (!entry) {
      entry = { id, nickname: data.league.name || id, addedAt: Date.now(), source };
      leagues.push(entry);
      saveLeagues(leagues);
    }
    if (getCloudConfig()) {
      try { await cloudUpsertLeague(entry); } catch (e) { console.error("Cloud push failed", e); }
    }
    input.value = "";
    navigate("league", { leagueId: id, tab: "standings" });
  });
};

window.syncOne = async function (id) {
  await withLoading(async () => { await syncLeagueData(id); });
};

/* -------- manual league team editing -------- */
async function pushManualLeagueUpdate(leagueId) {
  if (!getCloudConfig()) return;
  const leagues = getLeagues();
  const entry = leagues.find(l => l.id === leagueId);
  if (!entry) return;
  try { await cloudUpsertLeague(entry); } catch (e) { console.error("Cloud push failed", e); }
}

window.addManualTeam = async function (leagueId) {
  const data = getLeagueData(leagueId);
  if (!data) return;
  const nextId = data.rosters.reduce((max, r) => Math.max(max, r.roster_id || 0), 0) + 1;
  const userId = "u" + nextId;
  data.rosters.push({
    roster_id: nextId, owner_id: userId, players: [], starters: [],
    settings: { wins: 0, losses: 0, ties: 0, fpts: 0, fpts_decimal: 0, fpts_against: 0, fpts_against_decimal: 0 }
  });
  data.users.push({ user_id: userId, display_name: "New Team" });
  data.syncedAt = Date.now();
  saveLeagueData(leagueId, data);
  await pushManualLeagueUpdate(leagueId);
  render();
};

window.updateManualTeam = async function (leagueId, rosterId, field, value) {
  const data = getLeagueData(leagueId);
  if (!data) return;
  const roster = data.rosters.find(r => String(r.roster_id) === String(rosterId));
  if (!roster) return;
  const user = data.users.find(u => u.user_id === roster.owner_id);
  if (field === "name") {
    if (user) user.display_name = value;
  } else if (field === "wins" || field === "losses" || field === "ties") {
    roster.settings[field] = parseInt(value, 10) || 0;
  } else if (field === "pf") {
    const n = parseFloat(value) || 0;
    roster.settings.fpts = Math.floor(n);

    roster.settings.fpts_against_decimal = Math.round((n % 1) * 100);

/* -------- cloud sync connect/disconnect -------- */
async function mergeWithCloud() {
  const cloudLeagues = await cloudPullLeagues();
  const local = getLeagues();
  const merged = local.slice();
  cloudLeagues.forEach(cl => {
    const idx = merged.findIndex(l => l.id === cl.id);
    if (idx === -1) {
      merged.push(cl);
    } else {
      const localTeams = merged[idx].teams || {};
      const cloudTeams = cl.teams || {};
      merged[idx] = Object.assign({}, cl, { teams: Object.assign({}, localTeams, cloudTeams) });
    }
    // manual leagues have no API to re-sync from, so the cloud copy of their
    // standings IS the source of truth - write it into local league data.
    if (cl.source === "manual" && cl.manualData) {
      saveLeagueData(cl.id, cl.manualData);
    }
  });
  saveLeagues(merged);
  // anything local that the cloud doesn't know about yet gets pushed up,
  // so a thin/empty cloud table never causes local leagues to vanish.
  const cloudIds = new Set(cloudLeagues.map(l => l.id));
  for (const l of merged) {
    if (!cloudIds.has(l.id)) {
      try { await cloudUpsertLeague(l); } catch (e) { console.error("Cloud push failed", e); }
    }
  }
}

/* -------- matchup detail (boxscore, beta per-player points) -------- */
window.viewMatchupDetail = async function (leagueId, week, matchupId) {
  await withLoading(async () => {
    if (!PLAYERS) PLAYERS = await ensurePlayers(false);
    STATE.matchupDetailLeagueId = leagueId;
    STATE.matchupDetailWeek = week;

    let matchups = (STATE.matchupsCache && STATE.matchupsCache[leagueId]) || [];
    if (!matchups.length) {
      try { matchups = await fetchJSON(`${SLEEPER}/league/${leagueId}/matchups/${week}`) || []; STATE.matchupsCache[leagueId] = matchups; }
      catch (e) { matchups = []; }
    }
    const pair = matchups.filter(m => m.matchup_id === matchupId);
    STATE.matchupDetailPair = pair;

    if (!STATE.nflSchedule) {
      try {
        const res = await fetch(`https://api.sleeper.app/schedule/nfl/regular/2025`);
        STATE.nflSchedule = res.ok ? await res.json() : [];
      } catch (e) {
        STATE.nflSchedule = [];
      }
    }

    // Fetch actual/projected points for every rostered player - starters, bench, and IR
    const ids = new Set();
    pair.forEach(side => (side.players || []).forEach(id => { if (id && id !== "0") ids.add(id); }));
    STATE.matchupPlayerPoints = STATE.matchupPlayerPoints || {};
    for (const id of ids) {
      const key = `${id}-${week}`;
      if (STATE.matchupPlayerPoints[key] !== undefined) continue;
      try {
        const [statRes, projRes] = await Promise.all([
          fetch(`https://api.sleeper.com/stats/nfl/player/${id}?season_type=regular&season=2025&week=${week}`),
          fetch(`https://api.sleeper.com/projections/nfl/player/${id}?season_type=regular&season=2025&week=${week}`)
        ]);
        STATE.matchupPlayerPoints[key] = {
          stat: statRes.ok ? await statRes.json() : null,
          proj: projRes.ok ? await projRes.json() : null
        };
      } catch (e) {
        STATE.matchupPlayerPoints[key] = null;
      }
    }
  });
  navigate("matchupdetail");
};

/* -------- transactions -------- */
window.loadTransactions = async function (wide) {
  await withLoading(async () => {
    if (!PLAYERS) PLAYERS = await ensurePlayers(false);
    const state = await ensureNflState();
    const currentWeek = state.week || 1;
    let roundsToCheck;
    let cutoffDays;
    if (wide) {
      // diagnostic fallback: check every round from preseason through now, 60-day window
      roundsToCheck = new Set(Array.from({ length: currentWeek + 1 }, (_, i) => i));
      cutoffDays = 60;
    } else {
      // round 0 covers preseason/pre-lock moves - only worth checking near the
      // start of the season, since anything from back then is stale by now anyway.
      roundsToCheck = new Set([currentWeek, Math.max(0, currentWeek - 1)]);
      if (currentWeek <= 2) roundsToCheck.add(0);
      cutoffDays = 14;
    }

    const leagues = getLeagues().filter(l => !isDismissedByMe(l) && l.source !== "manual");
    let all = [];
    for (const l of leagues) {
      const data = getLeagueData(l.id);
      if (!data) continue;
      for (const w of roundsToCheck) {
        try {
          const rows = await fetchJSON(`${SLEEPER}/league/${l.id}/transactions/${w}`);
          (rows || []).forEach(t => all.push(Object.assign({}, t, {
            leagueId: l.id, leagueName: l.nickname, leagueUsers: data.users, leagueRosters: data.rosters
          })));
        } catch (e) { /* skip that week */ }
      }
    }
    const cutoff = Date.now() - cutoffDays * 24 * 60 * 60 * 1000;
    all = all.filter(t => !t.created || t.created >= cutoff);
    all.sort((a, b) => (b.created || 0) - (a.created || 0));
    STATE.transactions = all;
    STATE.transactionsShown = 30;
    STATE.transactionsWide = !!wide;
  });
};
window.goTransactions = function () {
  navigate("transactions");
  if (!STATE.transactions) loadTransactions();
};

/* -------- live draft -------- */
window.loadDrafts = async function () {
  await withLoading(async () => {
    if (!PLAYERS) PLAYERS = await ensurePlayers(false);
    const leagues = getLeagues().filter(l => l.source !== "manual");
    const draftsByLeague = {};
    for (const l of leagues) {
      try { draftsByLeague[l.id] = await fetchJSON(`${SLEEPER}/league/${l.id}/drafts`) || []; }
      catch (e) { draftsByLeague[l.id] = []; }
    }
    const picksByDraft = {};
    for (const id in draftsByLeague) {
      for (let i = 0; i < draftsByLeague[id].length; i++) {
        const d = draftsByLeague[id][i];
        if (d.status === "drafting") {
          try { picksByDraft[d.draft_id] = await fetchJSON(`${SLEEPER}/draft/${d.draft_id}/picks`) || []; }
          catch (e) { picksByDraft[d.draft_id] = []; }
          // the league drafts-list endpoint doesn't reliably include slot_to_roster_id -
          // fetch the single-draft endpoint for live drafts to guarantee we have it.
          try {
            const full = await fetchJSON(`${SLEEPER}/draft/${d.draft_id}`);
            if (full) draftsByLeague[id][i] = full;
          } catch (e) { /* keep the summary version */ }
        }
      }
    }
    STATE.draftsByLeague = draftsByLeague;
    STATE.picksByDraft = picksByDraft;
    STATE.draftsLoaded = true;
  });
};
window.goDraft = function () {
  navigate("draft");
  loadDrafts();
  if (draftPollInterval) clearInterval(draftPollInterval);
  draftPollInterval = setInterval(() => {
    if (STATE.route === "draft") loadDrafts();
  }, 15000);
};

function draftStatusLabel(status) {
  if (status === "drafting") return "Live";
  if (status === "pre_draft") return "Scheduled";
  if (status === "complete") return "Complete";
  return status || "Unknown";
}
function fmtDraftTime(ts) {
  if (!ts) return "Not scheduled";
  const d = new Date(ts);
  return d.toLocaleDateString([], { month: "short", day: "numeric", year: "numeric" }) + " " + d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
}

window.viewDraftBoard = async function (leagueId, draftId) {
  if (draftPollInterval) { clearInterval(draftPollInterval); draftPollInterval = null; }
  await withLoading(async () => {
    if (!PLAYERS) PLAYERS = await ensurePlayers(false);
    const full = await fetchJSON(`${SLEEPER}/draft/${draftId}`);
    const picks = await fetchJSON(`${SLEEPER}/draft/${draftId}/picks`) || [];
    STATE.draftsByLeague[leagueId] = STATE.draftsByLeague[leagueId] || [];
    const idx = STATE.draftsByLeague[leagueId].findIndex(d => d.draft_id === draftId);
    if (idx >= 0) STATE.draftsByLeague[leagueId][idx] = full; else STATE.draftsByLeague[leagueId].push(full);
    STATE.picksByDraft[draftId] = picks;
    STATE.selectedLeagueId = leagueId;
    STATE.selectedDraftId = draftId;
  });
  navigate("draftboard");
};

function rosterGridHtml(data, leagueEntry) {
  const q = (STATE.rosterFilter || "").toLowerCase();
  const slots = starterSlots(data.league);
  const myRosterId = leagueEntry ? myTeamFor(leagueEntry) : null;
  return data.rosters
    .filter(r => !q || teamLabel(r, data.users).toLowerCase().includes(q))
    .map(r => rosterCardHtml(r, data.users, slots, data.league, myRosterId))
    .join("");
}

function formatSlotLabel(slot) {
  const abbrev = {
    SUPER_FLEX: "SFLX", IDP_FLEX: "IDPX", WRRB_FLEX: "WRRB",
    REC_FLEX: "RECX", RB_FLEX: "RBFX", WR_FLEX: "WRFX", TE_FLEX: "TEFX"
  };
  return abbrev[slot] || slot;
}

function rosterCardHtml(roster, users, slots, league, myRosterId) {
  const starters = roster.starters || [];
  const reserve = roster.reserve || [];
  const taxi = roster.taxi || [];
  const all = roster.players || [];
  const bench = all.filter(id => !starters.includes(id) && !reserve.includes(id) && !taxi.includes(id));
  const isMine = myRosterId != null && String(roster.roster_id) === String(myRosterId);

  const row = (id, idx, showSlot) => {
    if (!id || id === "0") {
      return `<div class="prow empty"><span class="slot-tag">${slots[idx] ? formatSlotLabel(slots[idx]) : "-"}</span><span class="pname muted">Empty</span></div>`;
    }
    const p = PLAYERS ? PLAYERS[id] : null;
    const badge = badgeInfo(p);
    return `<div class="prow">
      ${showSlot ? `<span class="slot-tag">${slots[idx] ? formatSlotLabel(slots[idx]) : badge.label}</span>` : ""}
      <span class="pname">${escapeHtml(playerName(p, id))}</span>
      <span class="pbadge" style="background:${badge.color}">${badge.label}</span>
      ${p?.team ? `<span class="pteam">${p.team}</span>` : ""}
    </div>`;
  };

  // Position totals, limited to positions this league's roster_positions actually supports -
  // so a league with no IDP slots doesn't show a row of DL/LB/DB zeros.
  let countsHtml = "";
  if (league) {
    const counts = {};
    all.forEach(id => {
      const p = PLAYERS ? PLAYERS[id] : null;
      const fp = (p && (p.fantasy_positions?.[0] || p.position)) || null;
      if (fp) counts[fp] = (counts[fp] || 0) + 1;
    });
    const relevant = POS_GROUPS.filter(pg => leagueSupportsPosition(league, pg) && counts[pg]);
    if (relevant.length > 0) {
      countsHtml = `<div class="muted mono" style="font-size:10px; margin-top:6px; padding-top:6px; border-top:1px solid var(--line);">
        ${relevant.map(pg => `${pg} ${counts[pg]}`).join(" &middot; ")}
      </div>`;
    }
  }

  return `
    <div class="rcard" style="${isMine ? 'border-color: var(--gold); background: rgba(215,165,62,0.06);' : ''}">
      <div class="rcard-head">
        <span class="rcard-title">${isMine ? '<span class="pbadge" style="background:var(--gold); margin-right:5px;">MINE</span>' : ''}${escapeHtml(teamLabel(roster, users))}</span>
        <span class="rcard-count">${all.length} rostered</span>
      </div>
      <div class="rcard-section">
        <div class="rcard-section-label">Starters</div>
        ${starters.map((id,idx) => row(id, idx, true)).join("")}
      </div>
      ${bench.length ? `<div class="rcard-section"><div class="rcard-section-label">Bench</div>${bench.map(id=>row(id,null,false)).join("")}</div>` : ""}
      ${taxi.length ? `<div class="rcard-section"><div class="rcard-section-label">Taxi</div>${taxi.map(id=>row(id,null,false)).join("")}</div>` : ""}
      ${reserve.length ? `<div class="rcard-section"><div class="rcard-section-label">IR</div>${reserve.map(id=>row(id,null,false)).join("")}</div>` : ""}
      ${countsHtml}
    </div>`;
}

function finderWatchlistHtml() {
  const list = getFinderWatchlist();
  if (list.length === 0) {
    return `<div class="empty-state"><p>No players added yet. Search above and click "+ Add" on any result.</p></div>`;
  }
  const leagues = getLeagues();
  return list.map(id => {
    const p = PLAYERS ? PLAYERS[id] : null;
    const badge = badgeInfo(p);
    const hits = [];
    const ownedLeagueIds = new Set();
    leagues.forEach(l => {
      const data = getLeagueData(l.id);
      if (!data) return;
      data.rosters.forEach(r => {
        if ((r.players || []).includes(id)) {
          ownedLeagueIds.add(l.id);
          hits.push({
            leagueId: l.id, leagueName: l.nickname, teamName: teamLabel(r, data.users),
            status: (r.starters || []).includes(id) ? "Starter" : "Bench"
          });
        }
      });
    });
    const statsObj = STATE.showFinderPoints ? STATE.playerSeasonStats[id] : undefined;
    const hitRows = hits.map(h => {
      let pointsText = "";
      if (STATE.showFinderPoints) {
        if (statsObj === null) pointsText = " - stats unavailable";
        else if (statsObj) {
          const hd = getLeagueData(h.leagueId);
          const pts = hd ? computeLeaguePoints(statsObj, hd.league.scoring_settings) : null;
          pointsText = pts !== null ? ` - ${pts.toFixed(1)} pts (2025)` : "";
        }
      }
      return `<div class="finder-hit"><span>${escapeHtml(h.leagueName)} - ${escapeHtml(h.teamName)}${pointsText}</span><span class="muted">${h.status}</span></div>`;
    }).join("");
    return `
      <div class="finder-result">
        <div class="row" style="justify-content:space-between;">
          <span class="finder-player-name">${escapeHtml(playerName(p, id))}</span>
          <div class="row">
            <span class="pbadge" style="background:${badge.color}">${badge.label}</span>
            <button class="btn btn-sm btn-danger" onclick="removeFromFinderWatchlist('${id}')">Remove</button>
          </div>
        </div>
        ${hitRows || '<div class="muted" style="font-size:12px; margin-top:6px;">Not rostered in any saved league.</div>'}
        ${freeAgentLeaguesHtml(id, ownedLeagueIds)}
      </div>`;
  }).join("");
}

function computeLeaguePoints(statsObj, scoringSettings) {
  if (!statsObj || !scoringSettings) return null;
  const stats = statsObj.stats || statsObj;
  if (!stats || typeof stats !== "object") return null;
  let total = 0, matched = false;
  for (const key in scoringSettings) {
    if (typeof stats[key] === "number") {
      total += stats[key] * scoringSettings[key];
      matched = true;
    }
  }
  return matched ? total : null;
}

async function fetchPlayerSeasonStats(playerId, season) {
  const res = await fetch(`https://api.sleeper.com/stats/nfl/player/${playerId}?season_type=regular&season=${season}`);
  if (!res.ok) throw new Error("unavailable");
  return res.json();
}

async function loadFinderPointsForCurrentResults() {
  const q = (STATE.finderQuery || "").trim().toLowerCase();
  if (!q) return;
  const leagues = getLeagues();
  const ids = new Set();
  leagues.forEach(l => {
    const data = getLeagueData(l.id);
    if (!data) return;
    data.rosters.forEach(r => (r.players || []).forEach(id => {
      const p = PLAYERS ? PLAYERS[id] : null;
      if (playerName(p, id).toLowerCase().includes(q)) ids.add(id);
    }));
  });
  for (const id of ids) {
    if (STATE.playerSeasonStats[id] !== undefined) continue;
    try { STATE.playerSeasonStats[id] = await fetchPlayerSeasonStats(id, "2025"); }
    catch (e) { STATE.playerSeasonStats[id] = null; }
  }
}

window.toggleFinderPoints = async function () {
  STATE.showFinderPoints = !STATE.showFinderPoints;
  if (STATE.showFinderPoints) {
    render();
    await loadFinderPointsForCurrentResults();
  }
  render();
};

/* =========================================================
   RANKINGS: top 50 by position, 2025 total + points per game
   (beta - relies on the same unofficial stats endpoint as
   Player Finder's points feature)
========================================================= */
const RANKINGS_POSITIONS = ["QB","RB","WR","TE","K","DEF","DL","LB","DB"];

window.setRankingsLeague = function (id) { STATE.rankingsLeagueId = id; render(); };
window.setRankingsPosition = function (p) { STATE.rankingsPosition = p; render(); };

window.loadRankings = async function () {
  const leagueId = STATE.rankingsLeagueId;
  const position = STATE.rankingsPosition;
  if (!leagueId) return;
  await withLoading(async () => {
    if (!PLAYERS) PLAYERS = await ensurePlayers(false);
    const data = getLeagueData(leagueId);
    const scoring = data ? data.league.scoring_settings : null;
    const key = `${leagueId}|${position}`;
    let rows;
    try {
      const res = await fetch(`https://api.sleeper.com/stats/nfl/2025?season_type=regular&position[]=${position}&order_by=pts_std`);
      if (!res.ok) throw new Error("bad response");
      rows = await res.json();
    } catch (e) {
      STATE.rankingsData[key] = null;
      return;
    }
    const gpKeys = ["gp", "gms_active", "g", "games_played"];
    const computed = (rows || []).map(row => {
      const pid = row.player_id || row.playerId || (row.player && row.player.player_id);
      const pl = PLAYERS ? PLAYERS[pid] : null;
      const pts = computeLeaguePoints(row, scoring);
      const statsBlob = row.stats || row;
      let gp = null;
      for (const k of gpKeys) {
        if (typeof statsBlob[k] === "number" && statsBlob[k] > 0) { gp = statsBlob[k]; break; }
      }
      return { id: pid, name: playerName(pl, pid), team: (pl && pl.team) || row.team || "", badge: badgeInfo(pl), total: pts, gp };
    }).filter(r => r.id && r.total !== null);
    computed.sort((a, b) => b.total - a.total);
    STATE.rankingsData[key] = computed.slice(0, 50);
  });
};

function renderRankings() {
  const wrap = document.createElement("div");
  const leagues = getLeagues().filter(l => l.source !== "manual");
  if (leagues.length === 0) {
    wrap.appendChild(el(`<div class="empty-state"><p>Add a Sleeper league first - rankings need a league's scoring settings to compute points.</p></div>`));
    return wrap;
  }
  if (!STATE.rankingsLeagueId || !leagues.find(l => l.id === STATE.rankingsLeagueId)) {
    STATE.rankingsLeagueId = leagues[0].id;
  }

  wrap.appendChild(el(`
    <div class="row" style="margin-top:16px; justify-content:space-between; flex-wrap:wrap; gap:8px;">
      <div class="row">
        <span class="muted" style="font-size:12px;">Scoring from</span>
        <select onchange="setRankingsLeague(this.value)">
          ${leagues.map(l => `<option value="${l.id}" ${l.id===STATE.rankingsLeagueId?"selected":""}>${escapeHtml(l.nickname)}</option>`).join("")}
        </select>
        <select onchange="setRankingsPosition(this.value)">
          ${RANKINGS_POSITIONS.map(p => `<option value="${p}" ${p===STATE.rankingsPosition?"selected":""}>${p}</option>`).join("")}
        </select>
      </div>
      <button class="btn btn-sm btn-primary" onclick="loadRankings()" ${STATE.loading?"disabled":""}>
        ${STATE.loading ? '<span class="spinner"></span>' : ''} Load top 50
      </button>
    </div>
    <div class="muted" style="font-size:10.5px; margin-top:6px;">2025 regular season - unofficial stats endpoint, beta</div>
  `));

  const key = `${STATE.rankingsLeagueId}|${STATE.rankingsPosition}`;
  const rows = STATE.rankingsData[key];

  if (rows === undefined) {
    wrap.appendChild(el(`<div class="empty-state"><p>Click "Load top 50" to fetch ${STATE.rankingsPosition} rankings.</p></div>`));
    return wrap;
  }
  if (rows === null) {
    wrap.appendChild(el(`<div class="empty-state"><p>Stats unavailable for this position right now.</p></div>`));
    return wrap;
  }
  if (rows.length === 0) {
    wrap.appendChild(el(`<div class="empty-state"><p>No scoreable data found for ${STATE.rankingsPosition} in 2025 yet.</p></div>`));
    return wrap;
  }

  const panel = document.createElement("div");
  panel.className = "panel";
  panel.innerHTML = `
    <table>
      <thead><tr><th style="width:32px;">#</th><th>Player</th><th class="num">Total</th><th class="num">GP</th><th class="num">PPG</th></tr></thead>
      <tbody>
        ${rows.map((r, i) => `
          <tr>
            <td class="rank">${i+1}</td>
            <td>${escapeHtml(r.name)} ${r.team ? `<span class="muted mono" style="font-size:10px;">${escapeHtml(r.team)}</span>` : ""}</td>
            <td class="num mono">${r.total.toFixed(1)}</td>
            <td class="num mono">${r.gp || "-"}</td>
            <td class="num mono">${r.gp ? (r.total / r.gp).toFixed(1) : "-"}</td>
          </tr>`).join("")}
      </tbody>
    </table>`;
  wrap.appendChild(panel);
  return wrap;
}

function finderResultsHtml() {
  const q = (STATE.finderQuery || "").trim().toLowerCase();
  if (!q) {
    return `<div class="empty-state"><p>Type a name to see who owns them across your leagues.</p></div>`;
  }
  if (q.length < 3) {
    return `<div class="empty-state"><p>Keep typing - need at least 3 letters to search the full player list.</p></div>`;
  }
  if (!PLAYERS) {
    return `<div class="empty-state"><p>Loading player database...</p></div>`;
  }

  const leagues = getLeagues().filter(l => l.source !== "manual" && !isDismissedByMe(l) && getLeagueData(l.id));

  // Build ownership first: playerId -> hits[]
  const ownershipByPlayer = {};
  leagues.forEach(l => {
    const data = getLeagueData(l.id);
    data.rosters.forEach(r => {
      (r.players || []).forEach(id => {
        if (!ownershipByPlayer[id]) ownershipByPlayer[id] = [];
        ownershipByPlayer[id].push({
          leagueId: l.id, leagueName: l.nickname, teamName: teamLabel(r, data.users),
          status: (r.starters || []).includes(id) ? "Starter" : "Bench",
        });
      });
    });
  });

  // Search the whole player database, not just rostered players, so a
  // player who's a free agent everywhere still shows up.
  const matchIds = [];
  for (const id in PLAYERS) {
    if (playerName(PLAYERS[id], id).toLowerCase().includes(q)) matchIds.push(id);
  }
  if (matchIds.length === 0) {
    return `<div class="empty-state"><p>No players match "${escapeHtml(STATE.finderQuery)}".</p></div>`;
  }
  const capped = matchIds.slice(0, 40);
  const watchlist = getFinderWatchlist();

  return capped.map(id => {
    const p = PLAYERS[id];
    const badge = badgeInfo(p);
    const hits = ownershipByPlayer[id] || [];
    const ownedLeagueIds = new Set(hits.map(h => h.leagueId));
    const inList = watchlist.includes(id);
    const statsObj = STATE.showFinderPoints ? STATE.playerSeasonStats[id] : undefined;
    const hitRows = hits.map(h => {
      let pointsText = "";
      if (STATE.showFinderPoints) {
        if (statsObj === null) pointsText = ` - stats unavailable`;
        else if (statsObj) {
          const hd = getLeagueData(h.leagueId);
          const pts = hd ? computeLeaguePoints(statsObj, hd.league.scoring_settings) : null;
          pointsText = pts !== null ? ` - ${pts.toFixed(1)} pts (2025)` : "";
        }
      }
      return `<div class="finder-hit"><span>${escapeHtml(h.leagueName)} - ${escapeHtml(h.teamName)}${pointsText}</span><span class="muted">${h.status}</span></div>`;
    }).join("");
    return `
      <div class="finder-result">
        <div class="row" style="justify-content:space-between;">
          <span class="finder-player-name">${escapeHtml(playerName(p, id))}</span>
          <div class="row">
            <span class="pbadge" style="background:${badge.color}">${badge.label}</span>
            <button class="btn btn-sm ${inList?'btn-danger':'btn-primary'}" onclick="${inList ? `removeFromFinderWatchlist('${id}')` : `addToFinderWatchlist('${id}')`}">${inList ? "Remove" : "+ Add"}</button>
          </div>
        </div>
        ${hitRows || '<div class="muted" style="font-size:12px; margin-top:6px;">Not rostered in any saved league.</div>'}
        ${freeAgentLeaguesHtml(id, ownedLeagueIds)}
      </div>`;
  }).join("");
}

/* =========================================================
   RENDER: MATCHUPS
========================================================= */
function renderMatchups() {
  const wrap = document.createElement("div");
  const week = STATE.matchupWeek;
  wrap.appendChild(el(`
    <div class="row" style="margin-top:16px; justify-content:space-between;">
      <div class="row">
        <span class="muted" style="font-size:12px;">Week</span>
        <select onchange="loadMatchups(parseInt(this.value))">
          ${Array.from({length:18},(_,i)=>i+1).map(w=>`<option value="${w}" ${w===week?"selected":""}>${w}</option>`).join("")}
        </select>
        <button class="btn btn-sm ${!STATE.matchupsMyOnly?'btn-primary':''}" onclick="setMatchupsMyOnly(false)">All matchups</button>
        <button class="btn btn-sm ${STATE.matchupsMyOnly?'btn-primary':''}" onclick="setMatchupsMyOnly(true)">My matchups</button>
      </div>
      <button class="btn btn-sm" onclick="loadMatchups(${week||1})" ${STATE.loading?"disabled":""}>
        ${STATE.loading ? '<span class="spinner"></span>' : ''} Refresh
      </button>
    </div>
  `));

  const leagues = getLeagues().filter(l => !isDismissedByMe(l));
  if (leagues.length === 0) {
    wrap.appendChild(el(`<div class="empty-state"><p>Add a league first.</p></div>`));
    return wrap;
  }

  let anyShown = false;
  leagues.forEach(l => {
    const data = getLeagueData(l.id);
    if (!data) return;
    const matchups = (STATE.matchupsCache && STATE.matchupsCache[l.id]) || [];
    const groups = {};
    matchups.forEach(m => { (groups[m.matchup_id] = groups[m.matchup_id] || []).push(m); });
    let pairs = Object.values(groups);

    if (STATE.matchupsMyOnly) {
      const myRosterId = myTeamFor(l);
      if (!myRosterId) return; // no team set here, nothing to show in "my only" mode
      pairs = pairs.filter(pair => pair.some(m => String(m.roster_id) === String(myRosterId)));
      if (pairs.length === 0) return; // bye week or not synced yet for this league
    }

    anyShown = true;
    wrap.appendChild(el(`<div style="font-weight:700; margin:18px 0 8px;">${escapeHtml(l.nickname)}</div>`));
    const grid = document.createElement("div");
    grid.className = "roster-grid";
    if (pairs.length === 0) {
      grid.appendChild(el(`<div class="muted" style="font-size:12px;">No matchup data for week ${week || "?"} yet.</div>`));
    } else {
      pairs.forEach(pair => {
        const [a, b] = pair;
        const rosterA = data.rosters.find(r => r.roster_id === a.roster_id);
        const rosterB = b ? data.rosters.find(r => r.roster_id === b.roster_id) : null;
        const myRosterId = myTeamFor(l);
        const isMine = !!myRosterId && (String(a.roster_id) === String(myRosterId) || (b && String(b.roster_id) === String(myRosterId)));
        grid.appendChild(el(matchupCardHtml(a, rosterA, b, rosterB, data.users, isMine, l.id, week)));
      });
    }
    wrap.appendChild(grid);
  });

  if (!anyShown) {
    wrap.appendChild(el(`<div class="empty-state"><p>${STATE.matchupsMyOnly ? 'No teams set yet, or no matchup data loaded for week ' + (week || '?') + '.' : 'No matchup data for this week yet.'}</p></div>`));
  }

  return wrap;
}
function matchupCardHtml(a, rosterA, b, rosterB, users, isMine, leagueId, week) {
  const nameA = rosterA ? teamLabel(rosterA, users) : `Roster ${a.roster_id}`;
  const nameB = rosterB ? teamLabel(rosterB, users) : (b ? `Roster ${b.roster_id}` : "Bye");
  const ptsA = (a.points || 0).toFixed(2);
  const ptsB = b ? (b.points || 0).toFixed(2) : "-";
  const diff = b ? Math.abs((a.points || 0) - (b.points || 0)) : null;
  const highlightStyle = isMine ? "border-color: var(--gold); background: rgba(215,165,62,0.06);" : "";
  const clickAttr = b ? `onclick="viewMatchupDetail('${leagueId}', ${week}, ${a.matchup_id})" style="${highlightStyle} cursor:pointer;"` : `style="${highlightStyle}"`;
  return `
    <div class="rcard" ${clickAttr}>
      ${isMine ? '<span class="pbadge" style="background:var(--gold); margin-bottom:6px; display:inline-block;">MY GAME</span>' : ""}
      <div class="prow" style="justify-content:space-between;"><span class="pname" style="font-weight:600;">${escapeHtml(nameA)}</span><span class="mono" style="font-weight:800;">${ptsA}</span></div>
      <div class="prow" style="justify-content:space-between;"><span class="pname" style="font-weight:600;">${escapeHtml(nameB)}</span><span class="mono" style="font-weight:800;">${ptsB}</span></div>
      ${diff !== null ? `<div class="muted mono" style="font-size:11px; margin-top:6px;">Margin: ${diff.toFixed(2)}</div>` : ""}
      ${b ? `<div class="muted" style="font-size:10px; margin-top:4px;">Click for boxscore &gt;</div>` : ""}
    </div>`;
}

/* =========================================================
   RENDER: MATCHUP DETAIL (boxscore, beta actual/projected)
========================================================= */
function nflGameInfo(team, week) {
  if (!team || !STATE.nflSchedule) return "";
  const game = STATE.nflSchedule.find(g => g.week === week && (g.home === team || g.away === team));
  if (!game) return "";
  const opp = game.home === team ? game.away : game.home;
  const prefix = game.home === team ? "" : "@";
  let dateText = "";
  if (game.date) {
    const d = new Date(game.date);
    if (!isNaN(d.getTime())) {
      dateText = d.toLocaleDateString([], { weekday: "short" });
      if (game.date.includes("T") || game.date.includes(":")) {
        dateText += " " + d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
      }
    }
  }
  return `${prefix}${opp}${dateText ? " " + dateText : ""}`;
}

function playerStatusBadge(p) {
  const status = p && p.injury_status;
  if (!status) return "";
  const color = status === "Out" || status === "IR" ? "var(--loss)" : "var(--gold)";
  return `<span class="pbadge" style="background:${color};">${escapeHtml(status)}</span>`;
}

function matchupPlayerMeta(pid, week) {
  const pl = PLAYERS ? PLAYERS[pid] : null;
  const badge = badgeInfo(pl);
  const game = nflGameInfo(pl?.team, week);
  const key = `${pid}-${week}`;
  const entry = STATE.matchupPlayerPoints ? STATE.matchupPlayerPoints[key] : undefined;
  let actual = "-", proj = "-";
  if (entry) {
    const ap = STATE.matchupDetailScoring ? computeLeaguePoints(entry.stat, STATE.matchupDetailScoring) : null;
    const pp = STATE.matchupDetailScoring ? computeLeaguePoints(entry.proj, STATE.matchupDetailScoring) : null;
    if (ap !== null) actual = ap.toFixed(1);
    if (pp !== null) proj = pp.toFixed(1);
  }
  return { pl, badge, game, actual, proj, statusHtml: playerStatusBadge(pl) };
}

function matchupSlotRowHtml(pidA, pidB, slotLabel, week, showPosBadge) {
  const cell = (pid) => {
    if (!pid || pid === "0") return { name: "Empty", meta: "", actual: "", proj: "", statusHtml: "", badgeHtml: "" };
    const m = matchupPlayerMeta(pid, week);
    const badgeHtml = showPosBadge ? `<span class="pbadge" style="background:${m.badge.color};">${m.badge.label}</span>` : "";
    return { name: playerName(m.pl, pid), meta: m.game, actual: m.actual, proj: m.proj, statusHtml: m.statusHtml, badgeHtml };
  };
  const A = cell(pidA);
  const B = pidB !== undefined ? cell(pidB) : { name: "", meta: "", actual: "", proj: "", statusHtml: "", badgeHtml: "" };

  return `
    <div class="mu-slot-row">
      <div class="mu-name" style="grid-column:1; grid-row:1; text-align:left;">${escapeHtml(A.name)} ${A.badgeHtml} ${A.statusHtml}</div>
      <div class="mu-score" style="grid-column:2; grid-row:1; text-align:right;">${A.actual}</div>
      <div class="mu-slot-label" style="grid-column:3; grid-row:1 / 3;">${slotLabel}</div>
      <div class="mu-score" style="grid-column:4; grid-row:1; text-align:left;">${B.actual}</div>
      <div class="mu-name" style="grid-column:5; grid-row:1; text-align:right;">${B.statusHtml} ${B.badgeHtml} ${escapeHtml(B.name)}</div>
      <div class="mu-meta" style="grid-column:1; grid-row:2; text-align:left;">${escapeHtml(A.meta)}</div>
      <div class="mu-score-sub" style="grid-column:2; grid-row:2; text-align:right;">${A.proj}</div>
      <div class="mu-score-sub" style="grid-column:4; grid-row:2; text-align:left;">${B.proj}</div>
      <div class="mu-meta" style="grid-column:5; grid-row:2; text-align:right;">${escapeHtml(B.meta)}</div>
    </div>`;
}

function renderMatchupDetail() {
  const wrap = document.createElement("div");
  const leagueId = STATE.matchupDetailLeagueId;
  const week = STATE.matchupDetailWeek;
  const league = getLeagues().find(l => l.id === leagueId);
  const data = getLeagueData(leagueId);
  const pair = STATE.matchupDetailPair || [];

  wrap.appendChild(el(`
    <div class="row" style="margin-top:16px; justify-content:space-between;">
      <span style="font-weight:700;">${escapeHtml(league?.nickname || "")} - Week ${week}</span>
      <button class="btn btn-sm" onclick="navigate('matchups')">Back to Matchups</button>
    </div>
    <div class="muted" style="font-size:10.5px; margin-top:4px;">Points, game info, and status use unofficial Sleeper endpoints - beta, may show "-" if unavailable</div>
  `));

  if (pair.length === 0 || !data) {
    wrap.appendChild(el(`<div class="empty-state"><p>No matchup data available.</p></div>`));
    return wrap;
  }

  const [sideA, sideB] = pair;
  const rosterA = data.rosters.find(r => r.roster_id === sideA.roster_id);
  const rosterB = sideB ? data.rosters.find(r => r.roster_id === sideB.roster_id) : null;
  STATE.matchupDetailScoring = data.league.scoring_settings;
  const slots = starterSlots(data.league);

  const panel = document.createElement("div");
  panel.className = "panel";
  panel.style.padding = "14px";
  panel.style.marginTop = "14px";

  let html = `
    <div style="display:grid; grid-template-columns: 1fr auto auto 1fr; gap:8px; align-items:center; margin-bottom:6px;">
      <span style="font-weight:700; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${escapeHtml(rosterA ? teamLabel(rosterA, data.users) : "Roster " + sideA.roster_id)}</span>
      <span class="mono" style="font-weight:800; font-size:16px;">${(sideA.points||0).toFixed(2)}</span>
      <span class="mono" style="font-weight:800; font-size:16px;">${sideB ? (sideB.points||0).toFixed(2) : "-"}</span>
      <span style="font-weight:700; font-size:13px; text-align:right; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${sideB ? escapeHtml(rosterB ? teamLabel(rosterB, data.users) : "Roster " + sideB.roster_id) : "Bye"}</span>
    </div>`;

  (sideA.starters || []).forEach((pidA, idx) => {
    const pidB = sideB ? (sideB.starters || [])[idx] : undefined;
    const slotLabel = slots[idx] ? formatSlotLabel(slots[idx]) : "";
    html += matchupSlotRowHtml(pidA, pidB, slotLabel, week, false);
  });

  panel.innerHTML = html;
  wrap.appendChild(panel);

  // Bench and IR - same mirrored row format, paired by index (not by position)
  const benchOf = (side, roster) => {
    if (!side) return [];
    const starters = side.starters || [];
    const reserve = (roster && roster.reserve) || [];
    return (side.players || []).filter(id => !starters.includes(id) && !reserve.includes(id));
  };
  const irOf = (roster) => (roster && roster.reserve) || [];

  const benchA = benchOf(sideA, rosterA), benchB = benchOf(sideB, rosterB);
  const irA = irOf(rosterA), irB = irOf(rosterB);

  if (benchA.length || benchB.length) {
    wrap.appendChild(el(`<div style="font-weight:700; margin:16px 0 8px;">Bench</div>`));
    const benchPanel = document.createElement("div");
    benchPanel.className = "panel";
    benchPanel.style.padding = "14px";
    let bh = "";
    const maxLen = Math.max(benchA.length, benchB.length);
    for (let i = 0; i < maxLen; i++) {
      bh += matchupSlotRowHtml(benchA[i], benchB[i], "BE", week, true);
    }
    benchPanel.innerHTML = bh;
    wrap.appendChild(benchPanel);
  }

  if (irA.length || irB.length) {
    wrap.appendChild(el(`<div style="font-weight:700; margin:16px 0 8px;">IR</div>`));
    const irPanel = document.createElement("div");
    irPanel.className = "panel";
    irPanel.style.padding = "14px";
    let ih = "";
    const maxLen = Math.max(irA.length, irB.length);
    for (let i = 0; i < maxLen; i++) {
      ih += matchupSlotRowHtml(irA[i], irB[i], "IR", week, true);
    }
    irPanel.innerHTML = ih;
    wrap.appendChild(irPanel);
  }

  return wrap;
}

function waiverInfoHtml(league) {
  const data = getLeagueData(league.id);
  if (!data) return "";
  const s = data.league.settings || {};
  const parts = [];
  const myRosterId = myTeamFor(league);
  if (s.waiver_budget) {
    const myRoster = myRosterId ? data.rosters.find(r => String(r.roster_id) === String(myRosterId)) : null;
    if (myRoster) {
      const used = (myRoster.settings && myRoster.settings.waiver_budget_used) || 0;
      parts.push(`Current FAAB $${s.waiver_budget - used}`);
    } else {
      parts.push(`FAAB budget $${s.waiver_budget} (set "My team" to see your remaining)`);
    }
  }
  if (s.trade_deadline) parts.push(`Trade deadline Week ${s.trade_deadline}`);
  const scheduleId = `waiver-sched-${league.id}`;
  return `
    <div style="padding:7px 0; border-top:1px solid var(--line);">
      <div style="font-size:11.5px;">
        <span style="font-weight:700;">${escapeHtml(league.nickname)}</span>
        ${parts.length ? `<span class="muted"> - ${parts.join(" | ")}</span>` : ""}
      </div>
      <div class="row" style="margin-top:5px; gap:6px;">
        <input id="${scheduleId}" type="text" placeholder="Waiver day/time (e.g. Wed 8:00 PM ET)" value="${escapeHtml(league.waiverSchedule || "")}" style="flex:1; min-width:180px; font-size:11.5px; padding:6px 8px;" />
        <button class="btn btn-sm" onclick="saveWaiverSchedule('${league.id}')">Save</button>
      </div>
    </div>`;
}

window.saveWaiverSchedule = async function (leagueId) {
  const input = document.getElementById(`waiver-sched-${leagueId}`);
  if (!input) return;
  const value = input.value.trim();
  const leagues = getLeagues();
  const l = leagues.find(x => x.id === leagueId);
  if (!l) return;
  l.waiverSchedule = value;
  saveLeagues(leagues);
  if (getCloudConfig()) {
    try { await cloudUpsertLeague(l); } catch (e) { console.error("Cloud push failed", e); }
  }
  render();
};
