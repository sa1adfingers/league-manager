    return wrap;
  }

  const shown = filtered.slice(0, STATE.transactionsShown);
  shown.forEach(t => wrap.appendChild(el(transactionCardHtml(t))));

  if (filtered.length > shown.length) {
    wrap.appendChild(el(`
      <div class="row" style="justify-content:center; margin-top:10px;">
        <button class="btn btn-sm" onclick="showMoreTransactions()">Show more (${filtered.length - shown.length} left)</button>
      </div>
    `));
  }

  return wrap;
}
window.setTxLeagueFilter = function (v) { STATE.transactionsLeagueFilter = v; STATE.transactionsShown = 30; render(); };
window.setTxTypeFilter = function (v) { STATE.transactionsTypeFilter = v; STATE.transactionsShown = 30; render(); };
window.showMoreTransactions = function () { STATE.transactionsShown += 30; render(); };

/* =========================================================
   RENDER: LIVE DRAFT
========================================================= */
function renderDraftTab() {
  const wrap = document.createElement("div");
  wrap.appendChild(el(`
    <div class="row" style="margin-top:16px; justify-content:space-between;">
      <span class="muted" style="font-size:12px;">Draft schedule across your leagues - auto-refreshes every 15s while live drafts are running</span>
      <button class="btn btn-sm" onclick="loadDrafts()" ${STATE.loading?"disabled":""}>
        ${STATE.loading ? '<span class="spinner"></span>' : ''} Refresh
      </button>
    </div>
  `));

  const leagues = getLeagues().filter(l => l.source !== "manual" && !isDismissedByMe(l));
  if (leagues.length === 0) {
    wrap.appendChild(el(`<div class="empty-state"><p>Add a Sleeper league first.</p></div>`));
    return wrap;
  }
  if (!STATE.draftsLoaded) {
    wrap.appendChild(el(`<div class="empty-state"><p>Loading drafts...</p></div>`));
    return wrap;
  }

  const entries = [];
  leagues.forEach(l => {
    const drafts = (STATE.draftsByLeague && STATE.draftsByLeague[l.id]) || [];
    drafts.forEach(d => entries.push({ league: l, draft: d }));
  });

  if (entries.length === 0) {
    wrap.appendChild(el(`<div class="empty-state"><p>No draft data found for your leagues yet.</p></div>`));
    return wrap;
  }

  const live = entries.filter(e => e.draft.status === "drafting");
  const upcoming = entries.filter(e => e.draft.status === "pre_draft")
    .sort((a, b) => (a.draft.start_time || 0) - (b.draft.start_time || 0));
  const done = entries.filter(e => e.draft.status === "complete")
    .sort((a, b) => (b.draft.start_time || 0) - (a.draft.start_time || 0));

  if (live.length > 0) {
    wrap.appendChild(el(`<div style="font-weight:700; margin:18px 0 8px; color:var(--gold);">Live now</div>`));
    live.forEach(e => wrap.appendChild(el(liveDraftCardHtml(e.league, e.draft))));
  }

  wrap.appendChild(el(`<div style="font-weight:700; margin:18px 0 8px;">Upcoming</div>`));
  if (upcoming.length === 0) {
    wrap.appendChild(el(`<div class="muted" style="font-size:12px;">No scheduled drafts.</div>`));
  } else {
    const panel = document.createElement("div");
    panel.className = "panel";
    panel.innerHTML = `
      <table>
        <thead><tr><th>League</th><th>Status</th><th class="num">Date</th></tr></thead>
        <tbody>
          ${upcoming.map(e => `
            <tr>
              <td>${escapeHtml(e.league.nickname)}</td>
              <td>${draftStatusLabel(e.draft.status)}</td>
              <td class="num mono">${fmtDraftTime(e.draft.start_time)}</td>
            </tr>`).join("")}
        </tbody>
      </table>`;
    wrap.appendChild(panel);
  }

  if (done.length > 0) {
    wrap.appendChild(el(`<div style="font-weight:700; margin:18px 0 8px;">Completed</div>`));
    const panel = document.createElement("div");
    panel.className = "panel";
    panel.innerHTML = `
      <table>
        <thead><tr><th>League</th><th class="num">Date</th><th class="num"></th></tr></thead>
        <tbody>
          ${done.map(e => `
            <tr style="cursor:pointer;" onclick="viewDraftBoard('${e.league.id}','${e.draft.draft_id}')">
              <td>${escapeHtml(e.league.nickname)}</td>
              <td class="num mono">${fmtDraftTime(e.draft.start_time)}</td>
              <td class="num muted">View board &gt;</td>
            </tr>`).join("")}
        </tbody>
      </table>`;
    wrap.appendChild(panel);
  }

  return wrap;
}

function findMySlot(draft, myRosterId) {
  if (!myRosterId || !draft.slot_to_roster_id) return null;
  const entry = Object.entries(draft.slot_to_roster_id).find(([, rid]) => String(rid) === String(myRosterId));
  return entry ? parseInt(entry[0], 10) : null;
}

function computePicksUntilMe(teams, madeCount, mySlot) {
  if (!teams || !mySlot) return null;
  const nextPickNo = madeCount + 1;
  for (let pickNo = nextPickNo; pickNo <= nextPickNo + teams * 3; pickNo++) {
    const round = Math.ceil(pickNo / teams);
    const posInRound = pickNo - (round - 1) * teams;
    const slotAtThisPick = (round % 2 === 1) ? posInRound : (teams - posInRound + 1);
    if (slotAtThisPick === mySlot) {
      return { picksUntil: pickNo - nextPickNo, isNow: pickNo === nextPickNo, round, posInRound };
    }
  }
  return null;
}

function liveDraftCardHtml(league, draft) {
  const picks = (STATE.picksByDraft && STATE.picksByDraft[draft.draft_id]) || [];
  const recent = picks.slice(-8).reverse();
  const data = getLeagueData(league.id);
  const teams = draft.settings?.teams || (data ? data.rosters.length : 0) || 0;

  const myRosterId = myTeamFor(league);
  const mySlot = findMySlot(draft, myRosterId);
  const onClock = computePicksUntilMe(teams, picks.length, mySlot);

  let notifier = "";
  if (onClock) {
    if (onClock.isNow) {
      notifier = `<div style="margin-top:8px; padding:8px 10px; border-radius:8px; background:var(--gold); color:#1a1305; font-weight:800; font-size:13px;">You're on the clock!</div>`;
    } else {
      notifier = `<div class="muted mono" style="margin-top:8px; font-size:11px;">${onClock.picksUntil} pick${onClock.picksUntil===1?"":"s"} until you're on the clock (Round ${onClock.round}, Pick ${onClock.posInRound})</div>`;
    }
  } else if (myRosterId && !mySlot) {
    notifier = `<div class="muted" style="margin-top:8px; font-size:11px;">Can't find your draft slot yet - try Refresh.</div>`;
  } else if (!myRosterId) {
    notifier = `<div class="muted" style="margin-top:8px; font-size:11px;">Set "My team" on this league to see your countdown.</div>`;
  }

  return `
    <div class="panel" style="padding:14px; margin-bottom:14px; border-color: var(--gold);">
      <div class="row" style="justify-content:space-between;">
        <span style="font-weight:700;">${escapeHtml(league.nickname)}</span>
        <div class="row">
          <span class="pbadge" style="background:var(--gold);">LIVE</span>
          <button class="btn btn-sm" onclick="viewDraftBoard('${league.id}','${draft.draft_id}')">Full board</button>
        </div>
      </div>
      <div class="muted" style="font-size:11px; margin-top:4px;">${picks.length} pick${picks.length===1?"":"s"} made</div>
      ${notifier}
      <div style="margin-top:8px;">
        ${recent.map(p => {
          const pl = PLAYERS ? PLAYERS[p.player_id] : null;
          const badge = badgeInfo(pl);
          const posInRound = teams ? (p.pick_no - (p.round - 1) * teams) : p.pick_no;
          const teamName = data ? rosterOwnerName(p.roster_id, data.rosters, data.users) : `Roster ${p.roster_id}`;
          return `<div class="prow" style="justify-content:space-between;">
            <span class="pname">R${p.round}.${String(posInRound||"").padStart(2,"0")} - ${escapeHtml(playerName(pl, p.player_id))}
              <span class="muted" style="font-size:10px;">(${escapeHtml(teamName)})</span>
            </span>
            <span class="pbadge" style="background:${badge.color}">${badge.label}</span>
          </div>`;
        }).join("") || '<div class="muted" style="font-size:12px;">No picks yet.</div>'}
      </div>
    </div>`;
}

/* =========================================================
   RENDER: DRAFT BOARD (full board + position-by-round analytics)
========================================================= */
const DRAFT_ANALYTICS_POS = ["QB","RB","WR","TE","DL","LB","DB","K","DEF"];

function renderDraftBoard() {
  const wrap = document.createElement("div");
  const leagueId = STATE.selectedLeagueId;
  const draftId = STATE.selectedDraftId;
  const leagues = getLeagues();
  const league = leagues.find(l => l.id === leagueId);
  const drafts = (STATE.draftsByLeague && STATE.draftsByLeague[leagueId]) || [];
  const draft = drafts.find(d => d.draft_id === draftId);
  const picks = (STATE.picksByDraft && STATE.picksByDraft[draftId]) || [];
  const data = getLeagueData(leagueId);

  wrap.appendChild(el(`
    <div class="row" style="margin-top:16px; justify-content:space-between;">
      <span style="font-weight:700;">${escapeHtml(league?.nickname || "")} draft board</span>
      <button class="btn btn-sm" onclick="navigate('draft')">Back to Live Draft</button>
    </div>
  `));

  if (!draft || picks.length === 0) {
    wrap.appendChild(el(`<div class="empty-state"><p>No pick data available for this draft.</p></div>`));
    return wrap;
  }

  const teams = draft.settings?.teams || (data ? data.rosters.length : 0) || 0;
  const rounds = draft.settings?.rounds || Math.max(1, ...picks.map(p => p.round || 1));

  const slotLabels = [];
  for (let s = 1; s <= teams; s++) {
    const rid = draft.slot_to_roster_id ? draft.slot_to_roster_id[String(s)] : null;
    const roster = data && rid ? data.rosters.find(r => String(r.roster_id) === String(rid)) : null;
    slotLabels.push(roster ? teamLabel(roster, data.users) : `Slot ${s}`);
  }

  const bySlot = {};
  picks.forEach(p => { bySlot[`${p.round}-${p.draft_slot}`] = p; });

  const boardPanel = document.createElement("div");
  boardPanel.className = "panel";
  boardPanel.style.overflowX = "auto";
  let boardHtml = `<table><thead><tr><th style="width:36px;">Rd</th>${slotLabels.map(n => `<th style="min-width:90px;">${escapeHtml(n)}</th>`).join("")}</tr></thead><tbody>`;
  for (let r = 1; r <= rounds; r++) {
    boardHtml += `<tr><td class="rank">${r}</td>`;
    for (let s = 1; s <= teams; s++) {
      const p = bySlot[`${r}-${s}`];
      if (!p) { boardHtml += `<td class="muted" style="font-size:11px;">-</td>`; continue; }
      const pl = PLAYERS ? PLAYERS[p.player_id] : null;
      const badge = badgeInfo(pl);
      boardHtml += `<td style="font-size:11px; white-space:nowrap;">${escapeHtml(playerName(pl, p.player_id))}<br/><span class="pbadge" style="background:${badge.color}">${badge.label}</span></td>`;
    }
    boardHtml += `</tr>`;
  }
  boardHtml += `</tbody></table>`;
  boardPanel.innerHTML = boardHtml;
  wrap.appendChild(boardPanel);

  wrap.appendChild(el(`<div style="font-weight:700; margin:18px 0 8px;">Positions by round</div>`));
  const countsByRound = {};
  picks.forEach(p => {
    const pl = PLAYERS ? PLAYERS[p.player_id] : null;
    const fp = (pl && (pl.fantasy_positions?.[0] || pl.position)) || "?";
    countsByRound[p.round] = countsByRound[p.round] || {};
    countsByRound[p.round][fp] = (countsByRound[p.round][fp] || 0) + 1;
  });
  const roundsWithPicks = Object.keys(countsByRound).map(Number).sort((a, b) => a - b);
  const analyticsPanel = document.createElement("div");
  analyticsPanel.className = "panel";
  analyticsPanel.innerHTML = `
    <table>
      <thead><tr><th>Round</th>${DRAFT_ANALYTICS_POS.map(p => `<th class="num">${p}</th>`).join("")}</tr></thead>
      <tbody>
        ${roundsWithPicks.map(r => `
          <tr>
            <td class="rank">${r}</td>
            ${DRAFT_ANALYTICS_POS.map(p => `<td class="num mono">${(countsByRound[r][p]) || 0}</td>`).join("")}
          </tr>`).join("")}
      </tbody>
    </table>`;
  wrap.appendChild(analyticsPanel);

  return wrap;
}

function rosterOwnerName(rosterId, rosters, users) {
  const r = rosters.find(x => x.roster_id === rosterId);
  return r ? teamLabel(r, users) : `Roster ${rosterId}`;
}
window.viewPlayerOwnership = function (name) {
  STATE.finderQuery = name;
  navigate("finder");
};

function transactionPlayerRow(pid, rosterId, t, sign) {
  const p = PLAYERS ? PLAYERS[pid] : null;
  const name = playerName(p, pid);
  const badge = badgeInfo(p);
  const color = sign === "+" ? "var(--win)" : "var(--loss)";
  return `
    <div class="prow" style="flex-wrap:wrap;">
      <span style="color:${color};">${sign} ${escapeHtml(name)}</span>
      <span class="pbadge" style="background:${badge.color};">${badge.label}</span>
      ${p?.team ? `<span class="muted mono" style="font-size:10px;">${escapeHtml(p.team)}</span>` : ""}
      <button class="btn btn-sm" style="padding:2px 8px; font-size:10.5px;" onclick="viewPlayerOwnership('${name.replace(/'/g, "\\'")}')">View ownership</button>
      <span class="muted" style="margin-left:auto; font-size:11px;">${escapeHtml(rosterOwnerName(rosterId, t.leagueRosters, t.leagueUsers))}</span>
    </div>`;
}

function transactionCardHtml(t) {
  const adds = t.adds || {};
  const drops = t.drops || {};
  const addRows = Object.keys(adds).map(pid => transactionPlayerRow(pid, adds[pid], t, "+"));
  const dropRows = Object.keys(drops).map(pid => transactionPlayerRow(pid, drops[pid], t, "-"));
  const isTrade = t.type === "trade";
  const typeLabel = t.type === "waiver" ? "Waiver" : isTrade ? "Trade" : "Free Agent";
  const cardStyle = isTrade
    ? "border-color: var(--gold); background: rgba(215,165,62,0.06);"
    : "";
  return `
    <div class="finder-result" style="${cardStyle}">
      <div class="row" style="justify-content:space-between;">
        <span style="font-weight:700; font-size:12.5px;">
          ${isTrade ? '<span class="pbadge" style="background:var(--gold); margin-right:4px;">TRADE</span>' : ""}
          ${escapeHtml(t.leagueName)} - ${typeLabel}
        </span>
        <span class="muted mono" style="font-size:10.5px;">${fmtTime(t.created)}</span>
      </div>
      <div style="margin-top:6px;">
        ${addRows.join("") || dropRows.join("") ? (addRows.join("") + dropRows.join("")) : '<span class="muted" style="font-size:12px;">No player changes recorded.</span>'}
      </div>
    </div>`;
}

/* =========================================================
   RENDER: POSITIONAL NEEDS (across leagues with "My team" set)
========================================================= */
/* =========================================================
   RENDER: EXPOSURE (player share % across "my" teams)
========================================================= */
window.setExposureFilter = function (v) { STATE.exposureFilter = v; render(); };

function leagueSupportsPosition(league, posGroup) {
  const slots = (league && league.roster_positions) || [];
  if (slots.includes(posGroup)) return true;
  if (["DL","LB","DB"].includes(posGroup) && slots.includes("IDP_FLEX")) return true;
  if (["QB","RB","WR","TE"].includes(posGroup) && (slots.includes("FLEX") || slots.includes("SUPER_FLEX"))) return true;
  return false;
}

function renderExposure() {
  const wrap = document.createElement("div");
  const leagues = getLeagues().filter(l => myTeamFor(l) && getLeagueData(l.id));

  if (leagues.length === 0) {
    wrap.appendChild(el(`<div class="empty-state"><p>No teams set yet. Set "My team" on a league to see your exposure here.</p></div>`));
    return wrap;
  }

  const totalTeams = leagues.length;
  // How many of "my" teams even support each position group - a league with no
  // IDP slots at all shouldn't dilute an LB's exposure percentage, for example.
  const posGroupTeamCount = {};
  POS_GROUPS.forEach(pg => {
    posGroupTeamCount[pg] = leagues.filter(l => leagueSupportsPosition(getLeagueData(l.id).league, pg)).length;
  });

  const counts = {}; // playerId -> { count, leagueNames: [] }
  leagues.forEach(l => {
    const data = getLeagueData(l.id);
    const roster = data.rosters.find(r => String(r.roster_id) === String(myTeamFor(l)));
    if (!roster) return;
    (roster.players || []).forEach(id => {
      if (!counts[id]) counts[id] = { count: 0, leagueNames: [] };
      counts[id].count++;
      counts[id].leagueNames.push(l.nickname);
    });
  });

  let rows = Object.keys(counts).map(id => {
    const p = PLAYERS ? PLAYERS[id] : null;
    const posGroup = (p && (p.fantasy_positions?.[0] || p.position)) || null;
    const denom = (posGroup && posGroupTeamCount[posGroup] > 0) ? posGroupTeamCount[posGroup] : totalTeams;
    return {
      id, name: playerName(p, id), badge: badgeInfo(p),
      count: counts[id].count, leagueNames: counts[id].leagueNames,
      denom, pct: (counts[id].count / denom) * 100
    };
  });
  rows.sort((a, b) => b.pct - a.pct || a.name.localeCompare(b.name));

  const q = (STATE.exposureFilter || "").trim().toLowerCase();
  if (q) rows = rows.filter(r => r.name.toLowerCase().includes(q));

  wrap.appendChild(el(`
    <div class="row" style="margin-top:16px; justify-content:space-between;">
      <span class="muted" style="font-size:12px;">Share of your teams rostering each player - IDP % only counts leagues with IDP slots</span>
    </div>
    <input type="text" placeholder="Filter by player name..." style="width:100%; margin:10px 0 14px;"
      oninput="setExposureFilter(this.value)" value="${escapeHtml(STATE.exposureFilter)}" />
  `));

  if (rows.length === 0) {
    wrap.appendChild(el(`<div class="empty-state"><p>No players match that filter.</p></div>`));
    return wrap;
  }

  const panel = document.createElement("div");
  panel.className = "panel";
  panel.innerHTML = `
    <table>
      <thead><tr><th>Player</th><th class="num">Teams</th><th class="num">Share</th></tr></thead>
      <tbody>
        ${rows.map(r => `
          <tr>
            <td>
              ${escapeHtml(r.name)} <span class="pbadge" style="background:${r.badge.color}">${r.badge.label}</span>
              <div class="muted" style="font-size:10px; margin-top:2px;">${r.leagueNames.map(n => escapeHtml(n)).join(", ")}</div>
            </td>
            <td class="num mono">${r.count}/${r.denom}</td>
            <td class="num mono">${r.pct.toFixed(0)}%</td>
          </tr>`).join("")}
      </tbody>
    </table>`;
  wrap.appendChild(panel);
  return wrap;
}

/* =========================================================
   RENDER: COMPARE ROSTERS
========================================================= */
function renderCompare() {
  const wrap = document.createElement("div");
  const leagues = getLeagues();

  if (leagues.length === 0) {
    wrap.appendChild(el(`<div class="empty-state"><p>Add at least one league to compare rosters.</p></div>`));
    return wrap;
  }

  wrap.appendChild(el(`<div style="margin-top:16px;"></div>`));
  const grid = document.createElement("div");
  grid.className = "compare-grid";
  grid.appendChild(comparePickerHtml("a", STATE.compareA, leagues));
  grid.appendChild(comparePickerHtml("b", STATE.compareB, leagues));
  wrap.appendChild(grid);

  return wrap;
}

function comparePickerHtml(side, state, leagues) {
  const data = state.leagueId ? getLeagueData(state.leagueId) : null;
  const slots = data ? starterSlots(data.league) : [];
  const roster = data && state.rosterId ? data.rosters.find(r => String(r.roster_id) === String(state.rosterId)) : null;
  const leagueEntry = state.leagueId ? leagues.find(l => l.id === state.leagueId) : null;
  const myRosterId = leagueEntry ? myTeamFor(leagueEntry) : null;

  const container = document.createElement("div");
  const leagueOptions = `<option value="">Select a league...</option>` +
    leagues.map(l => `<option value="${l.id}" ${state.leagueId===l.id?"selected":""}>${escapeHtml(l.nickname)}</option>`).join("");
  const teamOptions = data ? `<option value="">Select a team...</option>` +
    data.rosters.map(r => `<option value="${r.roster_id}" ${String(state.rosterId)===String(r.roster_id)?"selected":""}>${escapeHtml(teamLabel(r, data.users))}</option>`).join("") : "";

  container.innerHTML = `
    <div class="compare-picker">
      <select onchange="onCompareChange('${side}','leagueId', this.value)">${leagueOptions}</select>
      ${data ? `<select onchange="onCompareChange('${side}','rosterId', this.value)">${teamOptions}</select>` : ""}
    </div>
    <div>${roster ? rosterCardHtml(roster, data.users, slots, data.league, myRosterId) : ""}</div>
  `;
  return container;
}

/* =========================================================
   UTIL
========================================================= */
function escapeHtml(str) {
  return String(str ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}
window.navigate = navigate;

/* boot */
render();
if (getCloudConfig()) { pullCloudNow(); }
if (getLeagues().filter(l => l.source !== "manual").length > 0) {
  setTimeout(() => { if (!STATE.transactions) loadTransactions(); }, 300);
}
